{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "dns-client"
  },
  "spec": {
    "dnsPolicy": "None",
    "dnsConfig": {
      "nameservers": [
        "203.0.113.1"
      ],
      "options": [
        {
          "name": "timeout",
          "value": "1"
        },
        {
          "name": "attempts",
          "value": "1"
        }
      ]
    },
    "containers": [
      {
        "name": "client",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ]
      }
    ]
  }
}
