{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "network-demo"
  },
  "spec": {
    "containers": [
      {
        "name": "nginx",
        "image": "nginx:1.27",
        "command": [
          "sh",
          "-c",
          "printf 'server { listen 80; location / { return 200 \"Session 14 network fixed\\n\"; } }\\n' > /etc/nginx/conf.d/default.conf; exec nginx -g 'daemon off;'"
        ]
      }
    ]
  }
}
