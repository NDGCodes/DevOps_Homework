{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "mount-demo"
  },
  "spec": {
    "containers": [
      {
        "name": "nginx",
        "image": "nginx:1.27",
        "volumeMounts": [
          {
            "name": "config",
            "mountPath": "/etc/lab"
          }
        ]
      }
    ],
    "volumes": [
      {
        "name": "config",
        "configMap": {
          "name": "missing-config"
        }
      }
    ]
  }
}
